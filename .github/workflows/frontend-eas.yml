name: Frontend EAS (build or update)

on:
  workflow_dispatch:
    inputs:
      action:
        description: "What to do"
        type: choice
        options:
          - update
          - build
        required: true
      submit_to_testflight:
        description: "Submit to TestFlight after building"
        required: true
        default: false
        type: boolean
      message:
        description: "Update message (only used for the 'update' action)"
        type: string
        required: false
        default: ""

concurrency:
  group: frontend-eas-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json
      - run: npm ci
      - name: Install backend deps (needed for AppRouter type import)
        run: npm ci --prefix ../backend
      - run: npx tsc --noEmit
      - run: npm test

  build:
    if: ${{ inputs.action == 'build' }}
    needs: test
    runs-on: macos-26
    timeout-minutes: 90
    environment: production
    defaults:
      run:
        working-directory: frontend

    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EAS_LOCAL_BUILD_ARTIFACTS_DIR: ./builds

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci

      - name: Select Xcode
        run: |
          sudo xcode-select --switch /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          xcodebuild -showsdks

      - name: Install iOS build tooling
        run: |
          brew list fastlane >/dev/null 2>&1 || brew install fastlane
          brew list cocoapods >/dev/null 2>&1 || brew install cocoapods

      - name: Build local iOS IPA
        run: |
          mkdir -p "$EAS_LOCAL_BUILD_ARTIFACTS_DIR"
          npx eas-cli build \
            --platform ios \
            --profile production \
            --local \
            --non-interactive

      - name: Find IPA
        id: ipa
        run: |
          ipa_path="$(ls -t builds/*.ipa | head -n 1)"
          test -n "$ipa_path"
          echo "path=$ipa_path" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$ipa_path")" >> "$GITHUB_OUTPUT"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.ipa.outputs.name }}
          path: frontend/${{ steps.ipa.outputs.path }}
          if-no-files-found: error

      - name: Submit to TestFlight
        if: ${{ inputs.submit_to_testflight }}
        env:
          ASC_APP_ID: ${{ secrets.ASC_APP_ID }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_KEY_ISSUER_ID: ${{ secrets.ASC_API_KEY_ISSUER_ID }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        run: |
          test -n "$ASC_APP_ID"
          test -n "$ASC_API_KEY_ID"
          test -n "$ASC_API_KEY_ISSUER_ID"
          test -n "$ASC_API_KEY_P8_BASE64"
          node -e '
            const fs = require("fs");
            const path = require("path");
            const keyId = process.env.ASC_API_KEY_ID;
            const issuerId = process.env.ASC_API_KEY_ISSUER_ID;
            const keyPath = path.join(process.env.RUNNER_TEMP, "AuthKey_" + keyId + ".p8");
            fs.writeFileSync(keyPath, Buffer.from(process.env.ASC_API_KEY_P8_BASE64, "base64"));
            const eas = JSON.parse(fs.readFileSync("eas.json", "utf8"));
            eas.submit = eas.submit || {};
            eas.submit.production = eas.submit.production || {};
            eas.submit.production.ios = {
              ascAppId: process.env.ASC_APP_ID,
              ascApiKeyId: keyId,
              ascApiKeyIssuerId: issuerId,
              ascApiKeyPath: keyPath,
            };
            fs.writeFileSync("eas.json", JSON.stringify(eas, null, 2) + "\n");
          '
          npx eas-cli submit \
            --platform ios \
            --profile production \
            --path "${{ steps.ipa.outputs.path }}" \
            --no-wait \
            --non-interactive

  update:
    if: ${{ inputs.action == 'update' }}
    needs: test
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Install backend deps (needed for AppRouter type import)
        run: npm ci --prefix ../backend

      - name: EAS Update
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          # Passed via env rather than interpolated into the script: commit messages are
          # attacker-influenceable text, and ${{ }} inside `run` is shell injection.
          UPDATE_MESSAGE: ${{ inputs.message || github.event.head_commit.message || 'Manual update' }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
          EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID }}
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
          # Optional, so not in the check below: without it holdings keep their monograms.
          EXPO_PUBLIC_LOGO_DEV_KEY: ${{ secrets.EXPO_PUBLIC_LOGO_DEV_KEY }}
        run: |
          # EXPO_PUBLIC_* vars are inlined into the bundle at build time. An unset secret
          # is not an error to eas-cli — it would ship an update where the value reads
          # `undefined` at runtime, breaking sign-in or the API client with no failed job.
          for var in EXPO_PUBLIC_SUPABASE_URL EXPO_PUBLIC_SUPABASE_ANON_KEY EXPO_PUBLIC_API_URL \
                     EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID; do
            test -n "${!var}" || { echo "::error::$var is not set"; exit 1; }
          done
          npx eas-cli update \
            --channel production \
            --message "$UPDATE_MESSAGE" \
            --non-interactive
